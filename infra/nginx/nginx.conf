# =============================================================================
# Wizer Signage — Main Nginx configuration
# =============================================================================
# Reverse proxy + TLS termination for the Wizer Signage platform.
# Server blocks (virtual hosts) live in conf.d/*.conf and are included below.
# =============================================================================

# Run as the unprivileged nginx user inside the container.
user  nginx;

# Let nginx pick a sensible worker count based on available CPU cores.
worker_processes  auto;

# Allow more open file descriptors per worker (connections, upstreams, etc.).
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    # Accept as many connections as possible per event loop pass.
    multi_accept        on;
}

http {
    # -------------------------------------------------------------------------
    # MIME types & defaults
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    # $request_id is nginx's own per-request identifier. It is forwarded to the
    # API as X-Request-Id and echoed back in the error envelope, so one ID joins
    # the access log, the application log, and a user's screenshot of a failure.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" id=$request_id';

    access_log  /var/log/nginx/access.log  main;

    # -------------------------------------------------------------------------
    # Performance / connection handling
    # -------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    server_tokens       off;            # Do not leak the nginx version.

    # Allow large media uploads (signage assets, images, video).
    client_max_body_size 512m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # Shared proxy settings (applied within server/location blocks)
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_buffering    on;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Connection header for proxied requests, keyed on whether the client asked
    # for a protocol upgrade.
    #
    # The empty branch is "" and NOT "close" on purpose. nginx omits a header set
    # to the empty string, and an ABSENT Connection header is the precondition
    # for upstream keepalive (with proxy_http_version 1.1, set above) — it is
    # what lets the `keepalive` pools in conf.d actually hold connections open.
    # `close` here would tear down the upstream connection after every single
    # response, which is the documented way to have keepalive pools that are
    # configured but never used.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # -------------------------------------------------------------------------
    # Rate limiting (edge)
    # -------------------------------------------------------------------------
    # The API has its own per-identity throttler, but it only engages AFTER a
    # request has been parsed by Node and (for authenticated routes) a token has
    # been verified. A flood therefore still costs event-loop time and DB pool
    # slots. These zones shed that traffic at the edge, before it reaches Node.
    #
    # Sizing: a zone of 10m holds ~160k distinct addresses. Rates are per client
    # IP, so an ordinary site — even one with dozens of screens behind a single
    # NAT — stays far below them; the bursts absorb legitimate spikes such as a
    # dashboard page issuing several parallel requests.
    limit_req_zone  $binary_remote_addr zone=wizer_api:10m   rate=30r/s;
    # Credential endpoints: brute force is the threat, and no human logs in more
    # than a few times a minute. Deliberately an order of magnitude tighter.
    limit_req_zone  $binary_remote_addr zone=wizer_auth:10m  rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=wizer_conn:10m;

    # 429 (not nginx's default 503): this is a client-rate condition, and it is
    # what the API's own throttler returns, so clients see one consistent code.
    limit_req_status  429;
    limit_conn_status 429;
    # Log rejections at warn so they surface in the same error log as everything
    # else worth paging on. The default (error) makes normal throttling look
    # like a fault.
    limit_req_log_level warn;

    # -------------------------------------------------------------------------
    # Virtual hosts
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
