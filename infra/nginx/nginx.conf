# =============================================================================
# MasterSignage — Main Nginx configuration
# =============================================================================
# Reverse proxy + TLS termination for the MasterSignage platform.
# Server blocks (virtual hosts) live in conf.d/*.conf and are included below.
# =============================================================================

# Run as the unprivileged nginx user inside the container.
user  nginx;

# Let nginx pick a sensible worker count based on available CPU cores.
worker_processes  auto;

# Allow more open file descriptors per worker (connections, upstreams, etc.).
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    # Accept as many connections as possible per event loop pass.
    multi_accept        on;
}

http {
    # -------------------------------------------------------------------------
    # MIME types & defaults
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # -------------------------------------------------------------------------
    # Performance / connection handling
    # -------------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    server_tokens       off;            # Do not leak the nginx version.

    # Allow large media uploads (signage assets, images, video).
    client_max_body_size 512m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # Shared proxy settings (applied within server/location blocks)
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_buffering    on;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # WebSocket upgrade helper: maps the Connection header based on Upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # Virtual hosts
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
