# =============================================================================
# MasterSignage — Virtual host / server blocks
# =============================================================================
# Routing:
#   /                         -> dashboard:3000  (Next.js)
#   /api/                     -> api:3001        (NestJS, prefix preserved)
#   <WS_PATH> (default /ws)   -> api:3001        (websocket upgrade)
#
# TLS certificates are issued via Let's Encrypt (certbot webroot).
# See infra/nginx/README.md for the certificate workflow.
#
# >>> REPLACE the server_name placeholder below with your real domain. <<<
# =============================================================================

# -----------------------------------------------------------------------------
# Upstream definitions (resolved over the docker "master-signage" network).
# -----------------------------------------------------------------------------
upstream dashboard_upstream {
    server dashboard:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:3001;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP (port 80)
#   - Serves the ACME HTTP-01 challenge for certbot.
#   - Redirects everything else to HTTPS.
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name signage.example.com;   # <-- REPLACE with your domain.

    # Let's Encrypt ACME HTTP-01 challenge (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Redirect all other traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS (port 443)
# -----------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name signage.example.com;   # <-- REPLACE with your domain.

    # ---- TLS certificates (Let's Encrypt) -----------------------------------
    # These paths are populated by certbot and mounted into the container at
    # /etc/letsencrypt. Replace "signage.example.com" with your domain.
    ssl_certificate     /etc/letsencrypt/live/signage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signage.example.com/privkey.pem;

    # ---- TLS hardening -------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ---- Security response headers (apply to every response) ----------------
    # HSTS: force HTTPS for 2 years. Only enable once HTTPS is permanent (it is
    # hard to undo — browsers cache it). Remove `preload` until you submit the
    # domain to the HSTS preload list.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Note: the API already sends Helmet headers; nginx adds the transport-level
    # ones (HSTS) + a safety net. A page-level CSP is owned by the Next.js app.

    # Continue serving the ACME challenge over 443 as well (harmless, helps
    # certbot renewals if the redirect chain ever changes).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ---- Common forwarded headers -------------------------------------------
    # (Repeated per location below; nginx does not inherit proxy_set_header
    #  once a location defines its own, so they are declared explicitly.)

    # ---- API: /api/ -> api:3001 (prefix preserved) --------------------------
    location /api/ {
        proxy_pass http://api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Content uploads (≤300 MB) + device content downloads (range) need a
        # large body limit and generous timeouts. The global default is 512m.
        client_max_body_size 512m;
        proxy_request_buffering off;          # stream large uploads through
        proxy_read_timeout      300s;          # long downloads / slow uploads
        proxy_send_timeout      300s;
    }

    # ---- Next.js immutable build assets: long-lived caching -----------------
    location /_next/static/ {
        proxy_pass http://dashboard_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- WebSocket: <WS_PATH> -> api:3001 -----------------------------------
    # Canonical WS_PATH default is "/ws". If you set WS_PATH to "/socket.io"
    # (Socket.IO default), update the location prefix below to match.
    location /ws {
        proxy_pass http://api_upstream;

        # Upgrade the connection to a websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections: keep them open and avoid premature timeouts.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ---- Dashboard: / -> dashboard:3000 -------------------------------------
    location / {
        proxy_pass http://dashboard_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Next.js HMR / streaming support (also harmless in production).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
