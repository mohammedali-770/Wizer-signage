# Optional production overlay. Base compose keeps local json-file rotation as the
# safe default. Include this file only after a Fluentd-compatible collector is
# configured and monitored independently.

x-offbox-logging: &offbox-logging
  driver: fluentd
  options:
    fluentd-address: ${LOG_SHIPPING_ADDRESS:?LOG_SHIPPING_ADDRESS is required for log shipping}
    fluentd-async: 'true'
    # 8 MiB, not Docker's 1 MiB default. This buffer is what stands between a
    # collector blip and permanent, silent log loss: async mode drops whatever
    # does not fit and reports nothing. Measured during the off-box logging
    # drill, at ~900 bytes/line the 1 MiB default held roughly 1100 lines --
    # about ten seconds of a moderately busy API -- and a ten-second outage
    # under load lost 2945 of 4000 lines. 8 MiB buys roughly eight times that
    # window. It is per container in the daemon, so budget it across every
    # service listed below.
    fluentd-buffer-limit: ${LOG_SHIPPING_BUFFER_LIMIT:-8388608}
    # Docker parses this as a Go duration and rejects a bare number
    # ("time: missing unit in duration"), which fails container CREATE — not
    # compose rendering — so nothing catches it until a deploy or rollback
    # tries to start a container. The variable is named SECONDS, so the unit
    # is appended here and operators set a plain integer.
    fluentd-retry-wait: ${LOG_SHIPPING_RETRY_WAIT_SECONDS:-1}s
    tag: 'wizer.{{.Name}}'

services:
  api:
    logging: *offbox-logging
  dashboard:
    logging: *offbox-logging
  maintenance:
    logging: *offbox-logging
  nginx:
    logging: *offbox-logging
