# =============================================================================
# Wizer Signage — OPTIONAL containerized Let's Encrypt (certbot webroot)
# =============================================================================
# Use this override ALONGSIDE the base compose so it shares the nginx webroot +
# certificate volumes:
#
#   # 1) Issue the first certificate (nginx must already serve :80 for the
#   #    ACME HTTP-01 challenge — see docs/nginx-ssl.md):
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.certbot.yml \
#     run --rm certbot certonly --webroot -w /var/www/certbot \
#       -d "$APP_DOMAIN" --email "$LETSENCRYPT_EMAIL" --agree-tos --no-eff-email
#
#   # 2) Bring the renewal loop up (renews + the host/nginx reloads on change):
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.certbot.yml up -d certbot
#
# Prefer host certbot instead? See docs/nginx-ssl.md — both are documented.
# =============================================================================

services:
  certbot:
    image: certbot/certbot:latest
    container_name: wizer-signage-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Default command: attempt renewal every 12h (no-op until ~30 days to expiry).
    # `run --rm certbot certonly ...` (above) overrides this for initial issuance.
    #
    # --deploy-hook runs ONLY when a certificate was actually renewed. certbot
    # cannot signal nginx across containers (no Docker socket by design), so the
    # hook drops a marker into the shared webroot volume for observability; the
    # nginx container picks the new certificate up via its periodic reload
    # (infra/nginx/docker-entrypoint.d/99-cert-reloader.sh). Without that pair,
    # a renewed certificate sits on disk unserved until the next deploy.
    entrypoint: ''
    command: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet
      --deploy-hook 'date -u +%Y-%m-%dT%H:%M:%SZ > /var/www/certbot/.last-renewal && echo \"[certbot] certificate renewed; nginx will serve it after its next periodic reload\"';
      sleep 12h & wait $${!}; done"
    restart: unless-stopped
    networks:
      - wizer-signage
