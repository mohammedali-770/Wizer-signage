# =============================================================================
# Wizer Signage — Production-oriented Docker Compose (base file)
# =============================================================================
# Multi-tenant digital signage SaaS platform.
#
# This is the PRODUCTION base stack. It runs four services:
#   - api         : NestJS backend (apps/api)         -> internal port 3001
#   - dashboard   : Next.js frontend (apps/dashboard)  -> internal port 3000
#   - maintenance : cron worker (sweeps, reports, retention, backups) — no ports
#   - nginx       : reverse proxy + TLS termination     -> public ports 80/443
#
# DATABASE & STORAGE:
#   Database and object storage are provided by SUPABASE (external, managed).
#   They are NOT defined here. Connectivity is configured purely through env
#   vars (SUPABASE_URL, DATABASE_URL, DIRECT_URL, ...). Production has NO local
#   database container.
#
#   For OFFLINE/local development only, use the dev override which adds a
#   local postgres:16 service:
#     docker compose \
#       -f infra/docker/docker-compose.yml \
#       -f infra/docker/docker-compose.dev.yml up -d
#
# ENV:
#   All service configuration comes from the repo-root .env file (see
#   .env.example and docs/environment-variables.md). Build/run from the repo
#   root or adjust the relative paths below accordingly.
#
# USAGE (from repo root):
#   docker compose -f infra/docker/docker-compose.yml up -d
#   docker compose -f infra/docker/docker-compose.yml down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API — NestJS backend
  # Reads PORT from API_PORT (default 3001). Exposes /api/health for checks.
  # ---------------------------------------------------------------------------
  api:
    build:
      # Build context is the repo root so the Dockerfile can access the
      # pnpm workspace (apps/* and packages/*).
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: wizer-signage/api:${IMAGE_TAG:-latest}
    container_name: wizer-signage-api
    # Load all canonical env vars from the repo-root .env file.
    env_file:
      - ../../.env
    environment:
      # Ensure the container listens on the canonical internal port.
      NODE_ENV: ${NODE_ENV:-production}
      # Bind all interfaces so nginx can proxy to api:3001 over the docker
      # network. Binding localhost inside the container causes 502s.
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-3001}
      # Directory (host-mounted below) for public file downloads such as the
      # Android TV player APK, served at /api/downloads/<file>.
      APK_DOWNLOAD_DIR: /srv/downloads
      # Where multipart uploads are spooled. Content uploads are capped at
      # 300 MB and this container is capped at 768M of RAM, so they MUST go to
      # disk, not the heap. A named volume (below) keeps them off the
      # container's writable layer and makes the space usage inspectable.
      UPLOAD_TMP_DIR: /var/tmp/wizer-uploads
    volumes:
      # Drop .apk files into <repo-root>/downloads on the host (no rebuild
      # needed); each is then served at https://<domain>/api/downloads/<file>.
      - ../../downloads:/srv/downloads:ro
      - api-upload-spool:/var/tmp/wizer-uploads
    # Internal-only: reachable by nginx on the shared network. Not published.
    expose:
      - '3001'
    restart: unless-stopped
    # Time between SIGTERM and the SIGKILL that follows it. The default is 10s,
    # which is shorter than a content upload takes to finish: a redeploy during
    # a 300 MB upload killed the request mid-body and the user started over.
    # Nest closes its listener on SIGTERM and stops accepting new connections,
    # so this window is spent draining what is already in flight, not admitting
    # more work.
    stop_grace_period: 60s
    healthcheck:
      # Hit the NestJS health endpoint (global prefix "api"). Use 127.0.0.1
      # explicitly: inside the container "localhost" may resolve to IPv6 [::1],
      # which the server is not bound to, making the check fail.
      # READINESS, not liveness: /api/health answers from process.uptime() and
      # never touches the database, so a container with a dead DB connection
      # reported "healthy" forever and `restart: unless-stopped` never fired.
      # /api/health/ready runs SELECT 1 and returns 503 when the DB is unreachable.
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/api/health/ready',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 768M }
    networks:
      - wizer-signage

  # ---------------------------------------------------------------------------
  # Dashboard — Next.js frontend (App Router)
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
      args:
        # Baked into the client bundle at build time (Next.js inlines
        # NEXT_PUBLIC_*). Point it at your public HTTPS API base. NOT a secret.
        # REQUIRED: the build fails here if unset (no silent localhost default),
        # and next.config.mjs additionally rejects non-HTTPS/localhost values.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in .env (e.g. https://api.example.com/api)}
    image: wizer-signage/dashboard:${IMAGE_TAG:-latest}
    container_name: wizer-signage-dashboard
    env_file:
      - ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-3000}
      PORT: ${DASHBOARD_PORT:-3000}
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # Use 127.0.0.1, not localhost: inside the container wget resolves
      # localhost to IPv6 [::1] while Next.js listens on 0.0.0.0 (IPv4), so a
      # "localhost" check fails even though the server is healthy.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
    networks:
      - wizer-signage

  # ---------------------------------------------------------------------------
  # Maintenance worker — runs the Phase 10 maintenance CLI on a cron schedule
  # (busybox crond): alerts sweep, due scheduled reports, emergency auto-END,
  # nightly retention cleanup, and the database backup. No HTTP port. See
  # infra/docker/crontab and docs/data-retention.md.
  # ---------------------------------------------------------------------------
  maintenance:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.maintenance
    image: wizer-signage/maintenance:${IMAGE_TAG:-latest}
    container_name: wizer-signage-maintenance
    env_file:
      - ../../.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # pg_dump output target (mounted volume below).
      BACKUP_DIR: /backups
      TZ: ${TZ:-UTC}
      # Public domain, used by the nightly TLS expiry check (checks the cert the
      # endpoint actually SERVES, so it catches "renewed but nginx never reloaded").
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in .env (e.g. signage.example.com)}
      CERT_WARN_DAYS: ${CERT_WARN_DAYS:-21}
      # Optional dead-man's-switch (e.g. https://hc-ping.com/<uuid>). Pinged only
      # after a SUCCESSFUL backup, so an EXTERNAL service alerts when backups stop.
      # The in-app "backup overdue" alert is raised by this same container and so
      # cannot report its own death — this is the out-of-band signal.
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
    volumes:
      - backups:/backups
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pgrep', 'crond']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 384M }
    networks:
      - wizer-signage

  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy + TLS termination
  # Routes:
  #   /        -> dashboard:3000
  #   /api/    -> api:3001 (prefix preserved)
  # TLS certificates are issued via Let's Encrypt (certbot webroot).
  # See infra/nginx/README.md for the certificate workflow.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: wizer-signage-nginx
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Public domain for server_name + TLS cert paths. The official nginx image
      # runs envsubst on /etc/nginx/templates/*.template at startup and writes
      # the result to /etc/nginx/conf.d/. REQUIRED — the stack will not start
      # without it (no hardcoded domain lives in the active config).
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set in .env (e.g. wizer.sa)}
      # Substitute ONLY $APP_DOMAIN so nginx runtime vars ($host, $scheme, …)
      # are preserved. The doubled $$ escapes compose interpolation.
      NGINX_ENVSUBST_FILTER: '^APP_DOMAIN$$'
    volumes:
      # Main nginx configuration.
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Domain-agnostic server blocks: rendered to /etc/nginx/conf.d/ at startup
      # from APP_DOMAIN (replaces the old hardcoded conf.d/wizer-signage.conf).
      - ../nginx/templates:/etc/nginx/templates:ro
      # Periodic `nginx -s reload` so a certbot-renewed certificate is actually
      # served. nginx loads certs into memory at startup only, and certbot runs
      # in a different container, so without this a renewal is invisible until
      # the next deploy — and an expiry between deploys breaks HTTPS site-wide.
      - ../nginx/docker-entrypoint.d/99-cert-reloader.sh:/docker-entrypoint.d/99-cert-reloader.sh:ro
      # ACME HTTP-01 challenge webroot (shared with certbot).
      - certbot-webroot:/var/www/certbot:ro
      # Let's Encrypt issued certificates (managed on the host by certbot).
      - letsencrypt:/etc/letsencrypt:ro
      # Android APK distribution: nginx serves ${DOWNLOADS}/android/* directly at
      # /api/downloads/android/ (see the template). READ-ONLY — the public serving
      # container never writes here; scripts/publish-android-release.sh writes the
      # host directory. Same host dir the api mounts for the legacy /api/downloads
      # route. See docs/android-distribution.md.
      - ../../downloads:/usr/share/nginx/downloads:ro
    depends_on:
      api:
        condition: service_started
      dashboard:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    networks:
      - wizer-signage

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  wizer-signage:
    name: wizer-signage
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
#   certbot-webroot : shared ACME challenge directory between nginx & certbot.
#   letsencrypt     : persisted Let's Encrypt certificates.
# -----------------------------------------------------------------------------
volumes:
  certbot-webroot:
    name: wizer-signage-certbot-webroot
  letsencrypt:
    name: wizer-signage-letsencrypt
  # pg_dump backups written by the maintenance worker (see scripts/backup-db.sh).
  backups:
    name: wizer-signage-backups
  # Multipart uploads in flight. Transient by design — the API deletes each file
  # once it is streamed to object storage, and sweeps orphans at boot.
  api-upload-spool:
    name: wizer-signage-api-upload-spool
