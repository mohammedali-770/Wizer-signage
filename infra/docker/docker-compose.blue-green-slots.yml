# Production blue/green application slots. No nginx and no maintenance worker:
# those remain in the base stack. Slot image tags are fixed local aliases that
# deploy-blue-green.sh retags from a verified immutable SHA before recreation.

x-api-common: &api-common
  env_file:
    - ../../.env
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    API_HOST: ${API_HOST:-0.0.0.0}
    API_PORT: ${API_PORT:-3001}
    APK_DOWNLOAD_DIR: /srv/downloads
    UPLOAD_TMP_DIR: /var/tmp/wizer-uploads
  volumes:
    - ../../downloads:/srv/downloads:ro
    - api-upload-spool:/var/tmp/wizer-uploads
  expose:
    - '3001'
  restart: unless-stopped
  stop_grace_period: 60s
  healthcheck:
    test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3001/api/health/ready']
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }
  deploy:
    resources:
      limits: { cpus: '1.5', memory: 768M }
  networks:
    wizer-signage: {}

x-dashboard-common: &dashboard-common
  env_file:
    - ../../.env
  environment:
    NODE_ENV: ${NODE_ENV:-production}
    DASHBOARD_PORT: ${DASHBOARD_PORT:-3000}
    PORT: ${DASHBOARD_PORT:-3000}
  expose:
    - '3000'
  restart: unless-stopped
  healthcheck:
    test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }
  deploy:
    resources:
      limits: { cpus: '1.0', memory: 512M }
  networks:
    wizer-signage: {}

services:
  api_blue:
    <<: *api-common
    image: wizer-signage/api:blue
    container_name: wizer-signage-api-blue
    networks:
      wizer-signage:
        aliases: [api-blue]

  dashboard_blue:
    <<: *dashboard-common
    image: wizer-signage/dashboard:blue
    container_name: wizer-signage-dashboard-blue
    networks:
      wizer-signage:
        aliases: [dashboard-blue]

  api_green:
    <<: *api-common
    image: wizer-signage/api:green
    container_name: wizer-signage-api-green
    networks:
      wizer-signage:
        aliases: [api-green]

  dashboard_green:
    <<: *dashboard-common
    image: wizer-signage/dashboard:green
    container_name: wizer-signage-dashboard-green
    networks:
      wizer-signage:
        aliases: [dashboard-green]

networks:
  wizer-signage:
    external: true
    name: wizer-signage

volumes:
  api-upload-spool:
    external: true
    name: wizer-signage-api-upload-spool
