# =============================================================================
# Wizer Signage — Development override (OPTIONAL)
# =============================================================================
# This override is layered ON TOP of docker-compose.yml:
#
#   docker compose \
#     -f infra/docker/docker-compose.yml \
#     -f infra/docker/docker-compose.dev.yml up -d
#
# WHAT IT ADDS:
#   - A local postgres:17 service for OFFLINE development only.
#
# IMPORTANT:
#   Supabase (managed Postgres + storage) is the REAL/production target.
#   The local postgres below is a convenience for developing without a
#   network connection to Supabase. When using it, point DATABASE_URL /
#   DIRECT_URL at the local "postgres" service (see the example values
#   under the api service environment block, or override them in your .env).
#
#   Do NOT rely on the local database for anything production-like:
#   Row-Level Security policies, storage buckets, auth, and edge functions
#   provided by Supabase are NOT reproduced here.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Local Postgres — OPTIONAL, offline development only.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: wizer-signage-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wizer_signage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wizer_signage}
      POSTGRES_DB: ${POSTGRES_DB:-wizer_signage}
    ports:
      # Exposed on the host for local tooling (psql, GUI clients, migrations).
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-wizer_signage} -d ${POSTGRES_DB:-wizer_signage}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wizer-signage

  # ---------------------------------------------------------------------------
  # API — point at the local postgres and (optionally) enable hot reload.
  # ---------------------------------------------------------------------------
  api:
    environment:
      NODE_ENV: development
      # Local DATABASE_URL pointing at the bundled postgres service.
      # Override these in your .env to switch back to Supabase.
      DATABASE_URL: postgresql://${POSTGRES_USER:-wizer_signage}:${POSTGRES_PASSWORD:-wizer_signage}@postgres:5432/${POSTGRES_DB:-wizer_signage}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-wizer_signage}:${POSTGRES_PASSWORD:-wizer_signage}@postgres:5432/${POSTGRES_DB:-wizer_signage}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    # ---- Optional hot reload (uncomment to bind-mount source) ----------------
    # Mounting source enables live development against the container. Keep this
    # simple; for most workflows running `pnpm dev` on the host is preferred.
    # volumes:
    #   - ../../apps/api:/app/apps/api
    #   - ../../packages:/app/packages
    # command: ["pnpm", "--filter", "@wizer/api", "dev"]

  # ---------------------------------------------------------------------------
  # Dashboard — development environment / optional hot reload.
  # ---------------------------------------------------------------------------
  dashboard:
    environment:
      NODE_ENV: development
    # ---- Optional hot reload (uncomment to bind-mount source) ----------------
    # volumes:
    #   - ../../apps/dashboard:/app/apps/dashboard
    #   - ../../packages:/app/packages
    # command: ["pnpm", "--filter", "@wizer/dashboard", "dev"]

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    # VERSIONED ON PURPOSE. PostgreSQL refuses to start on a data directory
    # initialized by a different major -- it exits with "The data directory was
    # initialized by PostgreSQL 16, which is not compatible with this version".
    # Keeping one fixed name across the 16 -> 17 move would have meant an
    # ordinary `git pull && docker compose up` leaving the database failing its
    # health check and the API down with it.
    #
    # A new name means 17 initializes a fresh directory instead. The old volume
    # is NOT deleted, just no longer mounted: this is offline dev data, so
    # re-seed rather than migrate. Reclaim the space when you are done with it:
    #
    #   docker volume rm wizer-signage-postgres-data
    #
    # To carry data across instead, dump from the old volume BEFORE switching:
    #
    #   docker run --rm -v wizer-signage-postgres-data:/var/lib/postgresql/data \
    #     -v "$PWD":/out postgres:16-alpine \
    #     sh -c 'pg_ctl -D /var/lib/postgresql/data -o "-k /tmp" -w start \
    #            && pg_dumpall -h /tmp -U wizer_signage > /out/dev-dump.sql'
    #
    # then `psql` it into the new one once 17 is up.
    name: wizer-signage-postgres-17-data
