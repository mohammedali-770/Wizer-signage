name: Finalize OpenAPI request inventory

on:
  push:
    branches: [codex/http-only-refresh-cookie]
    paths:
      - '.github/workflows/finalize-openapi-request-count.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/http-only-refresh-cookie
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Update pinned request-body inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/common/openapi-requests.spec.ts')
          text = path.read_text()
          if text.count('toHaveLength(72)') != 2:
              raise SystemExit(f"expected two 72-count assertions, found {text.count('toHaveLength(72)')}")
          text = text.replace('toHaveLength(72)', 'toHaveLength(71)')
          text = text.replace('one undocumented body among 72', 'one undocumented body among 71')
          path.write_text(text)
          PY

      - name: Commit and push
        run: |
          git rm .github/workflows/finalize-openapi-request-count.yml
          git add apps/api/src/common/openapi-requests.spec.ts
          git commit -m 'test(openapi): update request-body inventory for cookie refresh'
          git push origin HEAD:codex/http-only-refresh-cookie
