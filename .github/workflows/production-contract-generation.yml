name: Final production contract generation

on:
  push:
    branches: [codex/production-readiness-final]
    paths:
      - '.github/workflows/production-contract-generation.yml'

permissions:
  contents: write

concurrency:
  group: production-contract-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://openapi:openapi@127.0.0.1:5432/openapi
      DIRECT_URL: postgresql://openapi:openapi@127.0.0.1:5432/openapi
      JWT_ACCESS_SECRET: ci-only-access-secret-value
      JWT_REFRESH_SECRET: ci-only-refresh-secret-value
      ENCRYPTION_KEY: ci-only-encryption-key-value
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/production-readiness-final
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Emit final OpenAPI contract
        working-directory: apps/api
        run: pnpm openapi:emit ../../contracts/openapi.json

      - name: Generate dashboard contract types
        run: pnpm --filter @wizer/dashboard contract:generate

      - name: Verify generated dashboard contract
        run: pnpm --filter @wizer/dashboard contract:check

      - name: Verify generated files are well formed
        run: git diff --check

      - name: Commit generated contract and self-clean workflow
        run: |
          printf 'validated_source_sha=%s\nvalidated_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/.production-contract-generation
          rm -f .github/workflows/production-contract-generation.yml
          git config user.name 'wizer-production-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A contracts/openapi.json apps/dashboard/src/lib/api-contract.generated.ts docs/.production-contract-generation .github/workflows/production-contract-generation.yml
          git commit -m 'chore(contract): refresh final production API types'
          git push origin HEAD:codex/production-readiness-final
