name: Targeted selector validation

on:
  push:
    branches: [codex/server-search-selectors]

concurrency:
  group: targeted-server-search
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wizer/dashboard test
      - run: pnpm --filter @wizer/dashboard typecheck
      - name: Production dashboard build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://signage.example.test/api
        run: pnpm --filter @wizer/dashboard build
