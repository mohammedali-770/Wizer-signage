name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: wizer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci_postgres_password@127.0.0.1:5432/wizer_ci
      DIRECT_URL: postgresql://postgres:ci_postgres_password@127.0.0.1:5432/wizer_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @wizer/api exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Check for schema drift
        run: |
          pnpm --filter @wizer/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Workspace tests
        run: pnpm test

      # The API carries explicit global + security-sensitive module thresholds in
      # apps/api/package.json. Plain `jest` does not enforce coverageThreshold;
      # this invocation does, so coverage cannot silently regress while tests stay green.
      - name: API coverage thresholds
        run: pnpm --filter @wizer/api exec jest --coverage --runInBand

      - name: E2E (auth matrix, real app + Postgres)
        working-directory: apps/api
        run: pnpm test:e2e
        env:
          JWT_ACCESS_SECRET: ci-only-access-secret-value
          JWT_REFRESH_SECRET: ci-only-refresh-secret-value
          ENCRYPTION_KEY: ci-only-encryption-key-value
          NODE_ENV: test

      - name: Backup script regression tests
        run: bash scripts/tests/backup-db.test.sh

      - name: Backup/restore drill (real Postgres + partitioned schema)
        run: bash scripts/tests/backup-restore-drill.sh

      - name: Rollback decision-logic tests
        run: bash scripts/tests/rollback.test.sh

      - name: Smoke-test self-test
        run: bash scripts/tests/smoke-test.test.sh

      - name: Deploy gate tests
        run: bash scripts/tests/deploy-gate.test.sh

      - name: Deploy nginx-reload tests
        run: bash scripts/tests/deploy-nginx-reload.test.sh

      - name: Nginx config tests
        run: bash scripts/tests/nginx-config.test.sh

      - name: OpenAPI contract is up to date
        working-directory: apps/api
        run: |
          pnpm openapi:emit "${RUNNER_TEMP}/openapi.json"
          if ! diff -u ../../contracts/openapi.json "${RUNNER_TEMP}/openapi.json"; then
            echo "::error::contracts/openapi.json is stale. Run: pnpm --filter @wizer/api openapi:emit"
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://openapi:openapi@127.0.0.1:5432/openapi
          DIRECT_URL: postgresql://openapi:openapi@127.0.0.1:5432/openapi
          JWT_ACCESS_SECRET: ci-only-access-secret-value
          JWT_REFRESH_SECRET: ci-only-refresh-secret-value
          ENCRYPTION_KEY: ci-only-encryption-key-value
          NODE_ENV: development

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.ci.invalid/api

  # Required on pull requests. Keep this as one job so image build, runtime boot,
  # and vulnerability scanning share the same local images and runner minutes.
  docker:
    name: Docker image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: docker_ci_postgres_password
          POSTGRES_DB: wizer_docker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: wizer-signage/api:ci
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api

      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          load: true
          tags: wizer-signage/dashboard:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ci.invalid/api
          cache-from: type=gha,scope=ci-dashboard
          cache-to: type=gha,mode=max,scope=ci-dashboard

      - name: Build maintenance image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.maintenance
          push: false
          load: true
          tags: wizer-signage/maintenance:ci
          cache-from: type=gha,scope=ci-maintenance
          cache-to: type=gha,mode=max,scope=ci-maintenance

      # Boots the actual Alpine production image, not `nest start` on the runner.
      # This catches missing Prisma/musl/OpenSSL/native runtime artifacts that a
      # successful docker build alone cannot detect.
      - name: Boot built API image against PostgreSQL and probe readiness
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f wizer-api-runtime-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name wizer-api-runtime-ci --network host \
            -e NODE_ENV=test \
            -e API_HOST=0.0.0.0 \
            -e API_PORT=3001 \
            -e DATABASE_URL=postgresql://postgres:docker_ci_postgres_password@127.0.0.1:5432/wizer_docker_ci \
            -e DIRECT_URL=postgresql://postgres:docker_ci_postgres_password@127.0.0.1:5432/wizer_docker_ci \
            -e JWT_ACCESS_SECRET=ci-only-access-secret-value \
            -e JWT_REFRESH_SECRET=ci-only-refresh-secret-value \
            -e ENCRYPTION_KEY=ci-only-encryption-key-value \
            wizer-signage/api:ci

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/api/health/ready >/dev/null; then
              echo 'Built API image readiness: OK'
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' wizer-api-runtime-ci 2>/dev/null | grep -qx true; then
              break
            fi
            sleep 2
          done
          docker logs wizer-api-runtime-ci >&2 || true
          echo 'ERROR: built API image never became ready.' >&2
          exit 1

      - name: Trivy — API image HIGH/CRITICAL fixed vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wizer-signage/api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Trivy — dashboard image HIGH/CRITICAL fixed vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wizer-signage/dashboard:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Trivy — maintenance image HIGH/CRITICAL fixed vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wizer-signage/maintenance:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  android:
    name: Android player (tests · lint · debug build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Unit tests · lint · assemble
        working-directory: apps/android-tv-player
        run: |
          ./gradlew --no-daemon \
            -PapiBaseUrl=https://api.ci.invalid/api \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: apps/android-tv-player/app/build/reports/
          retention-days: 7

  security:
    name: Dependency + secret scanning
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Report all advisories (non-blocking)
        if: always()
        run: pnpm audit --prod || true

      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git --redact --verbose --no-banner \
            --gitleaks-ignore-path=/repo/.gitleaksignore \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            /repo
