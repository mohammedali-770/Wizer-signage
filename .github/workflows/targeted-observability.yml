name: Targeted observability validation

on:
  push:
    branches: [codex/observability-ready]

permissions:
  contents: write

concurrency:
  group: targeted-observability-ready
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wizer/api db:generate
      - run: pnpm --filter @wizer/api lint
      - run: pnpm --filter @wizer/api typecheck
      - run: pnpm --filter @wizer/api test
      - run: pnpm --filter @wizer/dashboard test
      - run: pnpm --filter @wizer/dashboard typecheck
      - name: Production dashboard build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://signage.example.test/api
        run: pnpm --filter @wizer/dashboard build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android tests lint and debug build
        working-directory: apps/android-tv-player
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Record success and remove one-shot workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/targeted-observability.yml
          printf 'validated_sha=%s\nvalidated_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/.observability-targeted-ci
          git add .github/workflows/targeted-observability.yml docs/.observability-targeted-ci
          git commit --no-verify -m 'test: record targeted observability validation'
          git push origin HEAD:codex/observability-ready
