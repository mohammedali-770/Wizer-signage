name: Restore proof-of-play spec

on:
  push:
    branches: [codex/proof-of-play-tenant-unique]
    paths:
      - '.github/workflows/restore-proof-of-play-spec.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/proof-of-play-tenant-unique
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Restore full spec from main and patch only tenant assertion
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- apps/api/src/modules/proof-of-play/proof-of-play.service.spec.ts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/modules/proof-of-play/proof-of-play.service.spec.ts')
          text = path.read_text()
          old = """    expect(t.prisma.proofOfPlay.findMany.mock.calls[0][0].where).toEqual({\n      playbackSessionId: { in: ['a', 'b'] },\n    });\n"""
          new = """    expect(t.prisma.proofOfPlay.findMany.mock.calls[0][0].where).toEqual({\n      companyId: 'comp1',\n      playbackSessionId: { in: ['a', 'b'] },\n    });\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one batching assertion, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/restore-proof-of-play-spec.yml
          git add apps/api/src/modules/proof-of-play/proof-of-play.service.spec.ts
          git commit -m 'test(proof-of-play): require tenant-scoped batch lookup'
          git push origin HEAD:codex/proof-of-play-tenant-unique
