name: Finalize refresh-cookie branch v4

on:
  push:
    branches: [codex/http-only-refresh-cookie]
    paths:
      - '.github/workflows/refresh-cookie-finalize-v4.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: codex/http-only-refresh-cookie

      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bring branch onto current main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Make every refresh generation cryptographically unique
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/modules/auth/auth.service.ts')
          text = path.read_text()
          old = "{ sub: userId, sid: sessionId, typ: 'refresh' },"
          new = "{ sub: userId, sid: sessionId, typ: 'refresh', jti: randomUUID() },"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one refresh signing payload, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install, generate Prisma, and build OpenAPI workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter @wizer/types build
          pnpm --filter @wizer/shared build

      - name: Regenerate committed OpenAPI contract
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://openapi:openapi@127.0.0.1:5432/openapi
          DIRECT_URL: postgresql://openapi:openapi@127.0.0.1:5432/openapi
          JWT_ACCESS_SECRET: branch-only-access-secret-value
          JWT_REFRESH_SECRET: branch-only-refresh-secret-value
          ENCRYPTION_KEY: branch-only-encryption-key-value
          NODE_ENV: development
        run: pnpm openapi:emit ../../contracts/openapi.json

      - name: Remove one-shot workflows and commit generated result
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-cookie-finalize.yml
          git rm .github/workflows/refresh-cookie-finalize-v2.yml
          git rm .github/workflows/refresh-cookie-finalize-v3.yml
          git rm .github/workflows/refresh-cookie-finalize-v4.yml
          git add apps/api/src/modules/auth/auth.service.ts contracts/openapi.json
          git commit -m 'fix(auth): make refresh rotation unique and update OpenAPI'
          git push origin HEAD:codex/http-only-refresh-cookie
