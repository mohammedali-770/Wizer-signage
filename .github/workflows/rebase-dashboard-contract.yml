name: Refresh generated dashboard contract

on:
  push:
    branches: [codex/dashboard-openapi-types]
    paths:
      - '.github/workflows/rebase-dashboard-contract.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/dashboard-openapi-types
          fetch-depth: 0
      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Regenerate against post-cookie OpenAPI
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wizer/dashboard contract:generate
          pnpm --filter @wizer/dashboard contract:check
          pnpm --filter @wizer/dashboard typecheck
      - name: Remove one-shot workflows and push
        run: |
          rm -f .github/workflows/finalize-dashboard-openapi-types.yml
          rm -f .github/workflows/finalize-dashboard-openapi-types-v2.yml
          git rm .github/workflows/rebase-dashboard-contract.yml
          git add -A
          git commit -m 'chore: refresh generated dashboard contract from main'
          git push origin HEAD:codex/dashboard-openapi-types
