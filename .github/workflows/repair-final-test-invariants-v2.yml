name: One-shot final test invariant reconciliation v2

on:
  push:
    branches: [codex/production-readiness-final]
    paths:
      - '.github/workflows/repair-final-test-invariants-v2.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-final-test-invariants-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/production-readiness-final
          fetch-depth: 0

      - name: Reconcile integrated contract and invariant tests
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          # Async queue endpoints correctly return 202 Accepted. Count their
          # documented response schemas just like 200/201 success responses.
          response_path = 'apps/api/src/common/openapi-responses.spec.ts'
          replace(
              response_path,
              "const success = op.responses?.['200'] ?? op.responses?.['201'];",
              "const success = op.responses?.['200'] ?? op.responses?.['201'] ?? op.responses?.['202'];",
              expected=2,
          )
          replace(response_path, 'expect(total).toBe(209);', 'expect(total).toBe(211);')
          p = Path(response_path)
          p.write_text(p.read_text().replace('all 209 operations', 'all 211 operations').replace('among 209', 'among 211'))

          request_path = 'apps/api/src/common/openapi-requests.spec.ts'
          replace(request_path, 'expect(requestBodies()).toHaveLength(71);', 'expect(requestBodies()).toHaveLength(72);')
          replace(request_path, 'expect(bodies).toHaveLength(71);', 'expect(bodies).toHaveLength(72);')
          p = Path(request_path)
          p.write_text(p.read_text().replace('among 71', 'among 72').replace('all 71', 'all 72'))

          Path('apps/api/src/modules/monitoring/dto/fleet-health-response.dto.ts').write_text(
              """export {
            FleetHealthSummaryDto as FleetHealthResponseDto,
            FleetRecentCrashDto,
            FleetVersionDistributionDto,
          } from '../fleet-health.dto';
          """
          )

          crash = Path('apps/api/src/modules/monitoring/dto/crash-report.dto.ts')
          crash_text = crash.read_text()
          old_import = "import { IsInt, IsOptional, IsString, Matches, MaxLength, Min } from 'class-validator';"
          new_import = "import { IsInt, IsOptional, IsString, Length, Matches, MaxLength, Min } from 'class-validator';"
          if crash_text.count(old_import) != 1:
              raise SystemExit('crash-report.dto.ts: validator import shape changed unexpectedly')
          crash_text = crash_text.replace(old_import, new_import)
          marker = '  @Matches(/^[a-f0-9]{24}$/)\n  fingerprint!: string;'
          if crash_text.count(marker) != 1:
              raise SystemExit('crash-report.dto.ts: fingerprint validator shape changed unexpectedly')
          crash.write_text(crash_text.replace(marker, '  @Length(24, 24)\n  @Matches(/^[a-f0-9]{24}$/)\n  fingerprint!: string;'))

          isolation_test = Path('apps/api/src/common/security/telemetry-partition-isolation.spec.ts')
          iso = isolation_test.read_text()
          schema_line = "const schema = readFileSync(resolve(root, 'apps/api/prisma/schema.prisma'), 'utf8');\n"
          helper = schema_line + """
          function modelBlock(name: string): string {
            const marker = `model ${name} {`;
            const start = schema.indexOf(marker);
            if (start < 0) throw new Error(`${name} is missing from Prisma schema`);
            let depth = 0;
            for (let i = schema.indexOf('{', start); i < schema.length; i += 1) {
              if (schema[i] === '{') depth += 1;
              else if (schema[i] === '}') {
                depth -= 1;
                if (depth === 0) return schema.slice(start, i + 1);
              }
            }
            throw new Error(`${name} model block is unterminated`);
          }
          """
          if iso.count(schema_line) != 1:
              raise SystemExit('telemetry-partition-isolation.spec.ts: schema declaration changed')
          iso = iso.replace(schema_line, helper)
          old_proof = "const proof = schema.slice(schema.indexOf('model ProofOfPlay {'), schema.indexOf('model Heartbeat {'));"
          old_heartbeat = "const heartbeat = schema.slice(schema.indexOf('model Heartbeat {'), schema.indexOf('model DeviceEvent {'));"
          if iso.count(old_proof) != 1 or iso.count(old_heartbeat) != 1:
              raise SystemExit('telemetry-partition-isolation.spec.ts: brittle model slicing changed')
          iso = iso.replace(old_proof, "const proof = modelBlock('ProofOfPlay');")
          iso = iso.replace(old_heartbeat, "const heartbeat = modelBlock('Heartbeat');")
          isolation_test.write_text(iso)

          replace(
              'apps/android-tv-player/app/src/main/res/xml/network_security_config.xml',
              'no release build carries a localhost/LAN HTTP',
              'no release build carries a loopback/LAN HTTP',
          )

          replace(
              'apps/api/src/common/security/production-deploy-wrapper.spec.ts',
              "wrapper.indexOf('exec bash \"${SCRIPT_DIR}/deploy-blue-green.sh\"')",
              "wrapper.indexOf('bash \"${SCRIPT_DIR}/deploy-blue-green.sh\"')",
              expected=2,
          )

          Path('apps/api/src/common/security/telemetry-partition-check.spec.ts').write_text("""import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const root = resolve(__dirname, '..', '..', '..', '..', '..');
          const checkPath = resolve(root, 'scripts/assert-telemetry-partitions.sh');
          const isolationPath = resolve(root, 'scripts/assert-telemetry-partition-isolation.sh');
          const check = readFileSync(checkPath, 'utf8');
          const isolation = readFileSync(isolationPath, 'utf8');

          describe('telemetry physical-schema verifier', () => {
            it('is syntactically valid bash and read-only SQL across both verifier layers', () => {
              expect(() => execFileSync('bash', ['-n', checkPath])).not.toThrow();
              expect(() => execFileSync('bash', ['-n', isolationPath])).not.toThrow();
              for (const source of [check, isolation]) {
                expect(source).not.toMatch(/\\b(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE)\\b/);
              }
            });

            it('verifies both telemetry parents are RANGE partitioned', () => {
              expect(check).toContain('heartbeats proof_of_plays');
              expect(check).toContain('pg_partitioned_table');
              expect(check).toContain('is not RANGE partitioned');
            });

            it('delegates and verifies global proof-of-play idempotency infrastructure', () => {
              expect(check).toContain('assert-telemetry-partition-isolation.sh');
              expect(isolation).toContain('proof_of_play_session_keys');
              expect(isolation).toContain('companyId,playbackSessionId');
              expect(isolation).toContain('TRIGGER_CONFIG_BAD');
              expect(isolation).toContain('search_path=wizer_telemetry, public');
            });

            it('requires rolling maintenance plus current and next-month children', () => {
              expect(check).toContain('assert-telemetry-partition-isolation.sh');
              expect(isolation).toContain('wizer_ensure_telemetry_partitions');
              expect(isolation).toContain("interval '1 month'");
              expect(isolation).toContain('CURRENT_SUFFIX');
              expect(isolation).toContain('NEXT_SUFFIX');
              expect(isolation).toContain('missing wizer_telemetry.heartbeats_');
              expect(isolation).toContain('missing wizer_telemetry.proof_of_plays_');
            });

            it('rejects temporary swap-era parent object names', () => {
              expect(check).toContain('BAD_NAMES');
              expect(check).toContain('_partitioned_');
            });
          });
          """)

      - name: Verify repaired sources are well formed
        run: |
          set -euo pipefail
          git diff --check
          bash -n scripts/deploy-production.sh
          bash -n scripts/assert-telemetry-partitions.sh
          bash -n scripts/assert-telemetry-partition-isolation.sh

      - name: Commit repairs and remove one-shot workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-final-test-invariants.yml
          rm -f .github/workflows/repair-final-test-invariants-v2.yml
          git config user.name 'wizer-production-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test: reconcile final integrated invariants'
          git push origin HEAD:codex/production-readiness-final
