name: Finalize proof-of-play tenant uniqueness

on:
  push:
    branches: [codex/proof-of-play-tenant-unique]
    paths:
      - '.github/workflows/finalize-proof-of-play-tenant-unique.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/proof-of-play-tenant-unique
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply exact source/schema edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema = Path('apps/api/prisma/schema.prisma')
          text = schema.read_text()
          old = '  playbackSessionId    String             @unique\n'
          new = '  playbackSessionId    String\n'
          if text.count(old) != 1:
              raise SystemExit(f'schema playbackSessionId marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '  @@index([companyId, startedAt])\n'
          replacement = '  @@unique([companyId, playbackSessionId])\n' + marker
          if text.count(marker) != 1:
              raise SystemExit(f'schema index marker count={text.count(marker)}')
          schema.write_text(text.replace(marker, replacement, 1))

          service = Path('apps/api/src/modules/proof-of-play/proof-of-play.service.ts')
          text = service.read_text()
          old_where = '      where: { playbackSessionId: { in: sessionIds } },\n'
          new_where = '      where: { companyId: device.companyId, playbackSessionId: { in: sessionIds } },\n'
          if text.count(old_where) != 1:
              raise SystemExit(f'pre-read marker count={text.count(old_where)}')
          text = text.replace(old_where, new_where, 1)
          old_comment = '''    // playbackSessionId is CLIENT-SUPPLIED and globally unique across all\n    // tenants, so a lookup by it alone can resolve to another company's row.\n    // The tenant of any pre-existing row is therefore checked before anything\n    // is written: without this, any device-token holder could rewrite another\n    // company's playback record (the advertiser-billing and compliance trail)\n    // by replaying a session id — and session ids are printed in plaintext in\n    // every proof-of-play CSV export.\n'''
          new_comment = '''    // playbackSessionId is CLIENT-SUPPLIED. Database uniqueness is scoped to\n    // (companyId, playbackSessionId), and the batch pre-read above is scoped to\n    // device.companyId, so one tenant cannot pre-claim or resolve another\n    // tenant's idempotency key. Keep the screen check as a second boundary: a\n    // session id must not be reused across two screens inside the same company.\n'''
          if text.count(old_comment) != 1:
              raise SystemExit(f'ownership comment marker count={text.count(old_comment)}')
          service.write_text(text.replace(old_comment, new_comment, 1))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/finalize-proof-of-play-tenant-unique.yml
          git add apps/api/prisma/schema.prisma apps/api/src/modules/proof-of-play/proof-of-play.service.ts
          git commit -m 'fix(proof-of-play): scope session uniqueness to tenant'
          git push origin HEAD:codex/proof-of-play-tenant-unique
