name: Finalize dashboard OpenAPI types

on:
  push:
    branches: [codex/dashboard-openapi-types]
    paths:
      - '.github/workflows/finalize-dashboard-openapi-types.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/dashboard-openapi-types
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install pinned generator
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --filter @wizer/dashboard add -D openapi-typescript@^7

      - name: Add generator/check scripts and consume generated auth contract types
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'apps/dashboard/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['contract:generate'] = 'openapi-typescript ../../contracts/openapi.json -o src/lib/api-contract.generated.ts --export-type';
          pkg.scripts['contract:check'] = 'openapi-typescript ../../contracts/openapi.json -o src/lib/api-contract.generated.ts --export-type --check';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/dashboard/src/lib/types.ts')
          text = path.read_text()
          if "import type { ContractMeResponse, ContractUserView } from './api-contract';" not in text:
              text = "import type { ContractMeResponse, ContractUserView } from './api-contract';\n\n" + text
          old = '''export interface AuthUser {\n  id: string;\n  email: string;\n  name: string;\n  role: UserRole;\n  status: UserStatus;\n  companyId: string | null;\n}\nexport interface MeResponse {\n  user: AuthUser;\n  permissions: string[];\n  mfaSatisfied: boolean;\n  twoFactorRequired: boolean;\n}\n'''
          new = '''export type AuthUser = ContractUserView;\nexport type MeResponse = ContractMeResponse;\n'''
          if old not in text:
              raise SystemExit('expected hand-written auth response block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Generate types
        run: pnpm --filter @wizer/dashboard contract:generate

      - name: Add generated-contract drift gate to CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          marker = '''      - name: Build\n        # The dashboard production build requires an explicit, valid HTTPS\n'''
          insert = '''      - name: Dashboard generated OpenAPI types are up to date\n        run: pnpm --filter @wizer/dashboard contract:check\n\n      - name: Build\n        # The dashboard production build requires an explicit, valid HTTPS\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'CI build marker count={text.count(marker)}')
          path.write_text(text.replace(marker, insert, 1))
          PY

      - name: Verify generated types compile
        run: pnpm --filter @wizer/dashboard typecheck

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/finalize-dashboard-openapi-types.yml
          git add apps/dashboard/package.json apps/dashboard/src/lib/api-contract.generated.ts apps/dashboard/src/lib/api-contract.ts apps/dashboard/src/lib/types.ts pnpm-lock.yaml .github/workflows/ci.yml
          git commit -m 'feat(dashboard): generate API types from OpenAPI contract'
          git push origin HEAD:codex/dashboard-openapi-types
