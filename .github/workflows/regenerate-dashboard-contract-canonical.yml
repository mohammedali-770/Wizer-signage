name: Regenerate canonical dashboard contract

on:
  push:
    branches: [codex/dashboard-openapi-types]
    paths:
      - '.github/workflows/regenerate-dashboard-contract-canonical.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/dashboard-openapi-types
          fetch-depth: 0
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Regenerate canonical output
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wizer/dashboard contract:generate
          pnpm --filter @wizer/dashboard contract:check
          pnpm --filter @wizer/dashboard typecheck
      - name: Persist canonical output
        env:
          HUSKY: '0'
        run: |
          git rm .github/workflows/regenerate-dashboard-contract-canonical.yml
          git add apps/dashboard/src/lib/api-contract.generated.ts apps/dashboard/package.json
          git commit -m 'fix(dashboard): canonicalize generated API contract types'
          git push origin HEAD:codex/dashboard-openapi-types
