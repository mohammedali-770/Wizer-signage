name: Dashboard contract types

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/openapi.json'
      - 'apps/dashboard/package.json'
      - 'apps/dashboard/src/lib/api-contract.generated.ts'
      - 'apps/dashboard/src/lib/api-contract.ts'
      - 'apps/dashboard/src/lib/types.ts'
      - '.github/workflows/dashboard-contract-check.yml'

concurrency:
  group: dashboard-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-types:
    name: Generated OpenAPI types are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wizer/dashboard contract:check
      - run: pnpm --filter @wizer/dashboard typecheck
